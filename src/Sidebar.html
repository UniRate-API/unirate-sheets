<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css" />
    <style>
      body { font-family: 'Roboto', Arial, sans-serif; padding: 14px; color: #202124; }
      h2 { margin: 0 0 4px 0; font-size: 16px; }
      p.help { color: #5f6368; font-size: 12px; margin: 0 0 12px 0; }
      label { display: block; font-size: 12px; color: #5f6368; margin-bottom: 4px; }
      input[type="text"] {
        width: 100%; box-sizing: border-box; padding: 8px;
        border: 1px solid #dadce0; border-radius: 4px; font-size: 13px;
        font-family: 'Roboto Mono', monospace;
      }
      button { margin-top: 10px; }
      .row { display: flex; gap: 8px; }
      .row button { flex: 1; }
      .status {
        margin-top: 14px; padding: 10px; border-radius: 4px;
        font-size: 12px; display: none;
      }
      .status.ok    { background: #e6f4ea; color: #137333; display: block; }
      .status.fail  { background: #fce8e6; color: #c5221f; display: block; }
      .status.info  { background: #e8f0fe; color: #1967d2; display: block; }
      .footer { margin-top: 18px; font-size: 11px; color: #5f6368; }
      a { color: #1a73e8; text-decoration: none; }
      a:hover { text-decoration: underline; }
      .key-row { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; font-size: 12px; color: #5f6368; }
      .key-row code { font-family: 'Roboto Mono', monospace; background: #f1f3f4; padding: 2px 6px; border-radius: 3px; color: #202124; }
    </style>
  </head>
  <body>
    <h2>UniRate API key</h2>
    <p class="help">
      Stored on this spreadsheet only. Get a free key (1,000 requests / day) at
      <a href="https://unirateapi.com/signup" target="_blank">unirateapi.com/signup</a>.
    </p>

    <div id="current" class="key-row" style="display:none;">
      <span>Current key:</span><code id="masked">—</code>
      <button id="btnClear" class="action" style="margin-left:auto;">Clear</button>
    </div>

    <label for="apiKey">API key</label>
    <input type="text" id="apiKey" placeholder="ur_live_…" autocomplete="off" />

    <div class="row">
      <button id="btnSave" class="action">Save &amp; test</button>
      <button id="btnTest">Test only</button>
    </div>

    <div id="status" class="status"></div>

    <div class="footer">
      <p>Try <code>=UNIRATE("USD","EUR")</code> in any cell.</p>
      <p><a href="https://github.com/UniRate-API/unirate-sheets#readme" target="_blank">Function reference</a></p>
    </div>

    <script>
      function setStatus(kind, message) {
        var el = document.getElementById('status');
        el.className = 'status ' + kind;
        el.textContent = message;
      }
      function showCurrent(masked) {
        var row = document.getElementById('current');
        if (masked) {
          row.style.display = 'flex';
          document.getElementById('masked').textContent = masked;
        } else {
          row.style.display = 'none';
        }
      }
      function refreshStatus() {
        google.script.run
          .withSuccessHandler(function (s) { showCurrent(s && s.hasKey ? s.masked : null); })
          .getKeyStatus();
      }

      document.getElementById('btnSave').addEventListener('click', function () {
        var key = document.getElementById('apiKey').value;
        if (!key.trim()) {
          setStatus('fail', 'Enter an API key first.');
          return;
        }
        setStatus('info', 'Saving and testing…');
        google.script.run
          .withSuccessHandler(function (r) {
            setStatus(r.ok ? 'ok' : 'fail', r.message);
            if (r.ok) {
              document.getElementById('apiKey').value = '';
              refreshStatus();
            }
          })
          .withFailureHandler(function (e) { setStatus('fail', e && e.message ? e.message : 'Unknown error.'); })
          .saveApiKey(key);
      });

      document.getElementById('btnTest').addEventListener('click', function () {
        setStatus('info', 'Testing…');
        google.script.run
          .withSuccessHandler(function (r) { setStatus(r.ok ? 'ok' : 'fail', r.message); })
          .withFailureHandler(function (e) { setStatus('fail', e && e.message ? e.message : 'Unknown error.'); })
          .testStoredKey();
      });

      document.getElementById('btnClear').addEventListener('click', function () {
        google.script.run
          .withSuccessHandler(function () {
            setStatus('info', 'Key cleared.');
            refreshStatus();
          })
          .deleteApiKey();
      });

      refreshStatus();
    </script>
  </body>
</html>
